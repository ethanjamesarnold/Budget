<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#E3E7EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A1F" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="budget-sans.woff2" as="font" type="font/woff2" crossorigin>
<title>Budget</title>
<style>
@font-face {
  font-family: "Budget Sans";
  src: url("budget-sans.woff2") format("woff2");
  font-weight: 400 700;
  font-stretch: 75% 100%;
  font-display: swap;
}
:root {
  color-scheme: light;
  --bay: #E3E7EA;
  --tile: #F7F8F9;
  --line: #C8CFD5;
  --ink: #16212B;
  --muted: #56636E;
  --primary: #1F4E79;
  --on-primary: #FFFFFF;
  --buff: #F1E5C3;  --buff-edge: #B5964F;
  --blue: #D3E3F2;  --blue-edge: #5A87B1;
  --lav: #E2DBF0;   --lav-edge: #8A78B8;
  --grey: #E9EBED;  --grey-edge: #98A2AA;
  --warn: #8A5700;
  --neg: #B3261E;
  --pos: #22663A;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bay: #141A1F; --tile: #1D252C; --line: #303B44; --ink: #E5EBEF; --muted: #97A4AE;
    --primary: #6A9FD0; --on-primary: #0D1620;
    --buff: #3A3322; --buff-edge: #A88C52;
    --blue: #1E3142; --blue-edge: #5687B3;
    --lav: #2C2740;  --lav-edge: #8473B5;
    --grey: #232B32; --grey-edge: #63707A;
    --warn: #E2A93C; --neg: #F2766D; --pos: #6CC28B;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bay); color: var(--ink);
  font: 400 16px/1.4 "Budget Sans", Roboto, system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; text-align: inherit; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.num { font-stretch: 80%; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.neg { color: var(--neg); }
.pos { color: var(--pos); }
h1, h2 { margin: 0; }
h1 { font-size: 22px; font-weight: 700; }
h2 { font-size: 17px; font-weight: 600; }
[hidden] { display: none !important; }

#app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; max-width: 560px; margin: 0 auto; }
.bar {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top) + 8px) 14px 8px; background: var(--bay);
}
.grow { flex: 1; }
.brand { font-size: 20px; font-weight: 700; }
main { flex: 1; padding: 2px 14px 28px; }
.nav {
  position: sticky; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--tile); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
.nav button { height: 56px; text-align: center; font-size: 15px; font-weight: 500; color: var(--muted); position: relative; }
.nav button[aria-current="page"] { color: var(--ink); font-weight: 700; }
.nav button[aria-current="page"]::before {
  content: ""; position: absolute; top: -1px; left: 28%; right: 28%; height: 3px; background: var(--ink); border-radius: 0 0 3px 3px;
}

/* type selector: colour matches the strip each type produces */
.seg {
  display: flex; flex: 1 1 auto; min-width: 0; max-width: 360px; margin-right: auto;
  border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--tile);
}
.seg button {
  flex: 1 1 0; min-width: 0; padding: 8px 4px; text-align: center; white-space: nowrap;
  font-size: 15px; font-stretch: 88%; font-weight: 500; color: var(--muted);
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
/* each type takes the colour of the strip it produces; a refund is a (negative) expense strip */
.seg .k-expense[aria-pressed="true"],
.seg .k-refund[aria-pressed="true"]   { background: var(--buff); box-shadow: inset 0 -3px var(--buff-edge); }
.seg .k-income[aria-pressed="true"]   { background: var(--blue); box-shadow: inset 0 -3px var(--blue-edge); }
.seg .k-transfer[aria-pressed="true"] { background: var(--lav);  box-shadow: inset 0 -3px var(--lav-edge); }
@media (max-width: 380px) { .seg button { font-size: 14px; font-stretch: 80%; } }

.iconbtn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
.back { display: flex; align-items: center; gap: 2px; font-size: 20px; font-weight: 700; margin-left: -6px; padding: 4px 6px 4px 0; }
.syncpill { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px; border-radius: 16px; font-size: 13px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
.syncpill i { width: 9px; height: 9px; border-radius: 50%; background: var(--pos); }
.syncpill.busy i { background: var(--primary); }
.syncpill.warn i { background: var(--warn); }
.syncpill.warn span { color: var(--warn); font-weight: 600; }
.syncpill.bad i { background: var(--neg); }
.syncpill.bad span { color: var(--neg); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) {
  .syncpill.syncing i { animation: blink 0.9s ease-in-out infinite alternate; }
}
@keyframes blink { to { opacity: 0.25; } }

/* ---------- Log ---------- */
.amount-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 2px 10px; min-height: 76px; }
.amount { font-size: 58px; line-height: 1; font-weight: 700; font-stretch: 75%; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; white-space: nowrap; }
.amount .cur { font-size: 30px; font-weight: 500; color: var(--muted); margin-right: 3px; vertical-align: 18px; }
.amount.is-empty { color: var(--muted); opacity: 0.45; }
.amount.is-refund { color: var(--blue-edge); }
.chip {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px;
  border-radius: 17px; border: 1px solid var(--line); background: var(--tile); font-size: 14px; font-weight: 500; white-space: nowrap;
}
.chip.on, .chip[aria-pressed="true"] { background: var(--ink); color: var(--bay); border-color: var(--ink); }
/* 1 2 3 ⌫ / 4 5 6 ⌫ / 7 8 9 Clear / 0 0 . Clear */
.keypad { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 46px; gap: 6px; }
.keypad button {
  border-radius: var(--r); background: var(--tile); border: 1px solid var(--line);
  text-align: center; font-size: 26px; font-weight: 500; font-stretch: 85%;
  display: grid; place-items: center; user-select: none; -webkit-user-select: none;
}
.keypad button:active { background: var(--line); }
.keypad .k-back  { grid-column: 4; grid-row: 1 / span 2; }
.keypad .k-clear { grid-column: 4; grid-row: 3 / span 2; font-size: 17px; font-weight: 600; font-stretch: 90%; }
.keypad .k-zero  { grid-column: 1 / span 2; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 12px; }
.tile {
  min-height: 46px; padding: 6px 8px; border-radius: var(--r); background: var(--tile); border: 1px solid var(--line);
  text-align: center; font-size: 15px; font-weight: 500; line-height: 1.15;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.tile small { font-size: 12px; font-weight: 400; color: var(--muted); font-stretch: 85%; }
.tile[aria-pressed="true"] { background: var(--ink); color: var(--bay); border-color: var(--ink); }
.tile[aria-pressed="true"] small { color: inherit; opacity: 0.75; }
.tile.paid { color: var(--muted); }
.grid2 .tile { min-height: 58px; font-size: 16px; }
.picker { margin-top: 12px; }
.picker-head { display: flex; align-items: center; justify-content: space-between; min-height: 30px; }
.picker-head b { font-weight: 600; }
.picker .grid2 { margin-top: 6px; }
.linkbtn { color: var(--primary); font-weight: 600; font-size: 15px; padding: 8px 2px; }
.billsel {
  display: flex; align-items: center; gap: 4px; margin-top: 6px; padding: 4px 4px 4px 10px;
  border-radius: var(--r); background: var(--buff); border-left: 5px solid var(--buff-edge);
}
.billsel div { flex: 1; min-width: 0; font-size: 14px; }
.billsel b { font-weight: 600; margin-right: 6px; }
.billsel .mini { min-width: 36px; height: 34px; border-radius: 6px; display: grid; place-items: center; font-weight: 600; font-size: 14px; color: var(--ink); }
.meta { display: flex; gap: 6px; margin-top: 10px; align-items: center; }
.note {
  flex: 1; min-width: 0; height: 34px; border-radius: 17px; border: 1px solid var(--line); background: var(--tile);
  padding: 0 12px; font-size: 14px;
}
.saveto { margin-top: 12px; }
.lbl { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; min-height: 18px; }
.accts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.accts.three { grid-template-columns: repeat(3, 1fr); }
.acct {
  min-height: 52px; border-radius: var(--r); background: var(--tile); border: 1px solid var(--line);
  text-align: center; font-weight: 600; font-size: 15px; line-height: 1.1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.acct small { font-size: 12px; font-weight: 400; color: var(--muted); font-stretch: 85%; }
.acct.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.not-ready .acct, .not-ready .btn.primary { opacity: 0.45; }
.explain { margin: 12px 2px 0; color: var(--muted); font-size: 14px; }
.recent { margin-top: 22px; }
.recent h2, .ov h2, .debtv h2, .settings h2 { margin: 24px 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.recent h2 { margin-top: 0; }
.empty { color: var(--muted); font-size: 14px; margin: 4px 2px; }

/* ---------- strips ---------- */
.strips { display: grid; gap: 4px; }
.strip {
  --s: var(--buff); --e: var(--buff-edge);
  display: grid; grid-template-columns: 5.7rem minmax(0, 1fr) auto 3.7rem; width: 100%; min-height: 50px;
  background: var(--s); border-left: 6px solid var(--e); border-radius: 2px 6px 6px 2px;
  text-align: left; font-stretch: 82%; color: var(--ink);
}
.strip > span { padding: 6px 9px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.strip > span + span { border-left: 1px solid color-mix(in srgb, var(--e) 45%, transparent); }
.strip.cols3 { grid-template-columns: 5.7rem minmax(0, 1fr) auto; }
.t-income   { --s: var(--blue); --e: var(--blue-edge); }
.t-transfer { --s: var(--lav);  --e: var(--lav-edge); }
.t-adjust   { --s: var(--grey); --e: var(--grey-edge); }
.strip.pending { background: transparent; border: 1.5px dashed var(--e); border-left: 6px solid var(--e); }
.s-amt { font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.s-main b { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-main small { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-acct { font-size: 14px; font-weight: 500; white-space: nowrap; }
.s-date { font-size: 14px; color: var(--muted); align-items: flex-end; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.s-when { font-size: 14px; white-space: nowrap; align-items: flex-end; text-align: right; }
.st-overdue .s-when { color: var(--neg); font-weight: 600; }
.st-soon .s-when { color: var(--warn); font-weight: 600; }
.st-missed .s-when { color: var(--muted); }
.st-paid .s-when { color: var(--pos); font-weight: 600; }

/* ---------- Overview ---------- */
.mnav { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 2px 0 2px; }
.mnav h1 { font-size: 22px; text-align: center; flex: 1; }
.arrow { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--tile); }
.arrow:disabled { opacity: 0.3; }
.sub { text-align: center; color: var(--muted); font-size: 14px; margin: 0 0 10px; }
.ledger { border-top: 1px solid var(--line); }
.lrow { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); }
.lrow .num { font-size: 19px; font-weight: 500; white-space: nowrap; }
.lrow.total { border-bottom: 0; border-top: 2px solid var(--ink); margin-top: -1px; padding-top: 10px; align-items: center; }
.lrow.total > span:first-child { font-size: 19px; font-weight: 700; }
.lrow.total .num { font-size: 46px; font-weight: 700; font-stretch: 75%; line-height: 1; }
.atable { width: 100%; border-collapse: collapse; }
.atable th { font-size: 13px; font-weight: 500; color: var(--muted); text-align: right; padding: 2px 0 6px; }
.atable th:first-child, .atable td:first-child { text-align: left; }
.atable td { padding: 9px 0; border-top: 1px solid var(--line); text-align: right; font-size: 18px; font-stretch: 80%; font-variant-numeric: tabular-nums; }
.atable td:first-child { font-size: 15px; font-stretch: 100%; font-weight: 500; }
.atable td + td, .atable th + th { padding-left: 12px; }
.atable tr.total td { border-top: 2px solid var(--ink); font-weight: 700; }
details { margin-top: 10px; border-top: 1px solid var(--line); }
summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 14px 2px; font-size: 17px; font-weight: 600; }
summary::-webkit-details-marker { display: none; }
summary::after { content: ""; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: 0 6px 4px 0; }
details[open] summary::after { transform: rotate(-135deg); margin-bottom: -4px; }
summary span { margin-left: auto; margin-right: 14px; font-weight: 500; color: var(--muted); font-size: 15px; }
.catrow { display: flex; justify-content: space-between; padding: 8px 2px; border-bottom: 1px solid var(--line); }
.catrow:last-child { border-bottom: 0; }
.catrow .num { font-size: 18px; }
.ov .btn.block { margin-top: 18px; }

/* ---------- Debt ---------- */
.debt { margin-top: 12px; padding: 12px 14px 14px; border-radius: var(--r); background: var(--tile); border: 1px solid var(--line); }
.debt-head { display: flex; justify-content: space-between; align-items: center; }
.debt-head b { font-size: 17px; font-weight: 600; }
.debt-bal { font-size: 40px; font-weight: 700; font-stretch: 75%; line-height: 1.1; margin: 6px 0 2px; }
.debt-meta { font-size: 14px; color: var(--muted); }
.debt .btn { margin-top: 12px; }
.total-line { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 2px 10px; border-bottom: 2px solid var(--ink); }
.total-line .num { font-size: 30px; font-weight: 700; }
.payrow { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 15px; }
.payrow .num { font-size: 18px; margin-left: auto; }

/* ---------- Settings, forms, buttons ---------- */
.btn {
  min-height: 50px; padding: 0 18px; border-radius: var(--r); border: 1px solid var(--line); background: var(--tile);
  font-weight: 600; font-size: 16px; text-align: center;
}
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.block { width: 100%; display: block; }
.btn.danger { color: var(--neg); }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 15px; }
.rows { display: grid; gap: 4px; margin-bottom: 8px; }
.row {
  display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%;
  padding: 10px 12px; background: var(--tile); border: 1px solid var(--line); border-radius: var(--r);
}
.row b { display: block; font-weight: 600; }
.row small { color: var(--muted); font-size: 13px; }
.row .num { font-size: 18px; }
.field { display: grid; gap: 4px; margin: 10px 0; }
.field > span { font-size: 13px; color: var(--muted); }
.field > small { font-size: 13px; color: var(--muted); }
.field input, .field select {
  height: 48px; border-radius: var(--r); border: 1px solid var(--line); background: var(--tile); padding: 0 12px; width: 100%;
  font-size: 16px;
}
.check { display: flex; align-items: center; gap: 10px; margin: 12px 0; font-size: 15px; }
.check input { width: 22px; height: 22px; accent-color: var(--primary); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pair .field { margin: 6px 0; }
.actions { display: grid; gap: 8px; margin-top: 16px; }
.err { color: var(--neg); font-size: 14px; margin: 10px 2px 0; }
.foot { color: var(--muted); font-size: 13px; text-align: center; margin: 26px 0 10px; }
.settings section + section { margin-top: 6px; }
.onboard { padding-top: 12px; }
.onboard h1 { font-size: 26px; margin-bottom: 6px; }
.onboard p { color: var(--muted); margin: 0 0 12px; }

/* ---------- sheet + toast ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / 0.38); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 560px; margin: 0 auto;
  max-height: 90vh; max-height: 90dvh; overflow: auto; overscroll-behavior: contain;
  background: var(--bay); border-radius: 14px 14px 0 0; padding: 6px 16px calc(18px + env(safe-area-inset-bottom));
}
@media (prefers-reduced-motion: no-preference) {
  .sheet:not([hidden]) { animation: rise 0.18s ease-out; }
}
@keyframes rise { from { transform: translateY(28px); opacity: 0; } }
.grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 12px; }
.sheet h2 { font-size: 20px; margin-bottom: 4px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.toast {
  position: fixed; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  z-index: 30; display: none; align-items: center; gap: 14px; width: max-content; max-width: calc(100% - 28px);
  padding: 11px 14px; border-radius: 10px; background: var(--ink); color: var(--bay); font-size: 15px;
}
.toast.show { display: flex; }
.toast button { color: var(--bay); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
@keyframes nudge { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@media (prefers-reduced-motion: no-preference) { .nudge { animation: nudge 0.2s 2; } }
</style>
</head>
<body>
<div id="app">
  <header class="bar" id="bar"></header>
  <main id="view"></main>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
</div>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const VERSION = '1.1';

/* ================= constants ================= */
const ACCOUNTS = [
  { id: 'cobalt', name: 'Amex Cobalt', short: 'Cobalt', card: true },
  { id: 'bonvoy', name: 'Amex Bonvoy', short: 'Bonvoy', card: true },
  { id: 'scotia', name: 'Scotia Visa Infinite', short: 'Scotia', card: true },
  { id: 'debit', name: 'Debit', short: 'Debit', card: false },
  { id: 'other', name: 'Other', short: 'Other', card: false },
];
const CARDS = ACCOUNTS.filter(a => a.card);
const EXPENSE_CATS = ['Groceries', 'Eating out', 'Transport', 'Bills', 'Subscriptions', 'Shopping', 'Entertainment', 'Health', 'Other'];
const BILL_KIND = { Bills: 'bill', Subscriptions: 'sub' };
const INCOME_CATS = ['Paycheque', 'Other income'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON = MONTHS.map(m => m.slice(0, 3));
const DEFAULTS = { payAmount: 1777, payAnchor: '2026-12-01', payEvery: 14, defaultAccount: 'cobalt' };
const KEYS = { conf: 'budget.conf', server: 'budget.server', queue: 'budget.queue' };

/* ================= helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const round2 = n => Math.round((num(n) + Number.EPSILON) * 100) / 100;
const sum = (arr, f) => round2(arr.reduce((a, x) => a + num(f ? f(x) : x), 0));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
const isMonth = s => /^\d{4}-\d{2}$/.test(String(s || ''));
const monthOf = s => String(s).slice(0, 7);
const addMonths = (mk, n) => {
  let y = +mk.slice(0, 4), m = +mk.slice(5, 7) + n;
  y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1;
  return `${y}-${pad(m)}`;
};
const monthDiff = (a, b) => (+a.slice(0, 4) - +b.slice(0, 4)) * 12 + (+a.slice(5, 7) - +b.slice(5, 7));
const daysIn = mk => new Date(+mk.slice(0, 4), +mk.slice(5, 7), 0).getDate();
const dayNum = s => Math.round(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5);
const fromDayNum = n => { const d = new Date(n * 864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
const fmtDay = s => isDate(s) ? `${MON[+s.slice(5, 7) - 1]} ${+s.slice(8, 10)}` : '';
const monthName = mk => MONTHS[+mk.slice(5, 7) - 1];
const monthLabel = mk => `${monthName(mk)} ${mk.slice(0, 4)}`;
const ordinal = n => n + ((n % 100 >= 11 && n % 100 <= 13) ? 'th' : (['th', 'st', 'nd', 'rd'][n % 10] || 'th'));
const cad = new Intl.NumberFormat('en-CA', { style: 'currency', currency: 'CAD' });
const moneyAbs = n => cad.format(Math.abs(round2(n)));
const money = n => (round2(n) < 0 ? '−' : '') + moneyAbs(n);
const less = n => round2(n) === 0 ? moneyAbs(0) : (round2(n) > 0 ? '− ' : '+ ') + moneyAbs(n);
const more = n => round2(n) === 0 ? moneyAbs(0) : (round2(n) > 0 ? '+ ' : '− ') + moneyAbs(n);
const parseAmt = s => { const n = parseFloat(String(s == null ? '' : s).replace(/[^0-9.\-]/g, '')); return Number.isFinite(n) ? round2(n) : 0; };
const amtStr = n => { n = Math.abs(round2(n)); return Number.isInteger(n) ? String(n) : n.toFixed(2); };
const acct = id => ACCOUNTS.find(a => a.id === id) || (id === 'chequing' ? { id, name: 'Chequing', short: 'Chequing' } : { id, name: id || 'Other', short: id || 'Other' });
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function uid(prefix) {
  const a = new Uint32Array(2);
  (window.crypto || window.msCrypto).getRandomValues(a);
  return `${prefix}_${Date.now().toString(36)}${a[0].toString(36)}${a[1].toString(36).slice(0, 4)}`;
}
const chev = dir => `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="${dir < 0 ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7'}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const GEAR = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>';
const BACKSPACE = '<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';

/* ================= storage & state ================= */
const read = (k, fallback) => { try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch (_) { return fallback; } };
const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };
const blank = () => ({ tx: [], bills: [], debts: [], debtLog: [], settings: {} });

let conf = read(KEYS.conf, { api: '', key: '' }) || { api: '', key: '' };
let server = read(KEYS.server, null);
let queue = read(KEYS.queue, []) || [];
let db = rebuild();
const ui = { view: 'log', back: 'log', month: '', open: {}, connectMsg: '', connecting: false };
let draft = newDraft();
const net = { syncing: false, again: false, error: '', last: 0 };
let sheetOpen = false, settingsOpen = false;

function rebuild() {
  const s = server ? JSON.parse(JSON.stringify(server)) : blank();
  ['tx', 'bills', 'debts', 'debtLog'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  if (!s.settings || typeof s.settings !== 'object') s.settings = {};
  queue.forEach(op => applyOp(s, op));
  return s;
}

// Mirrors applyOp_ in Code.gs so the app shows changes instantly, before they reach the Sheet.
function applyOp(s, op) {
  const d = op.data || {};
  const upsert = (arr, row) => { const i = arr.findIndex(r => r.id === row.id); if (i >= 0) arr[i] = Object.assign({}, row); else arr.push(Object.assign({}, row)); };
  const del = (arr, id) => { const i = arr.findIndex(r => r.id === id); if (i >= 0) arr.splice(i, 1); };
  switch (op.kind) {
    case 'tx.put': if (d.id) upsert(s.tx, d); break;
    case 'tx.del': del(s.tx, d.id); break;
    case 'bill.put': if (d.id) upsert(s.bills, d); break;
    case 'bill.del': del(s.bills, d.id); break;
    case 'debt.put': if (d.id) upsert(s.debts, d); break;
    case 'debt.del': del(s.debts, d.id); break;
    case 'debt.pay': {
      if (!d.id || s.debtLog.some(p => p.id === d.id)) break;
      const debt = s.debts.find(x => x.id === d.debtId);
      if (!debt) break;
      debt.balance = round2(num(debt.balance) - num(d.amount));
      debt.updated = d.created;
      s.debtLog.push({ id: d.id, date: d.date, debtId: d.debtId, amount: num(d.amount), created: d.created });
      break;
    }
    case 'debt.unpay': {
      const i = s.debtLog.findIndex(p => p.id === d.id);
      if (i < 0) break;
      const p = s.debtLog[i];
      const debt = s.debts.find(x => x.id === p.debtId);
      if (debt) { debt.balance = round2(num(debt.balance) + num(p.amount)); debt.updated = new Date().toISOString(); }
      s.debtLog.splice(i, 1);
      break;
    }
    case 'settings.put': Object.assign(s.settings, d); break;
  }
}

function commit(kind, data, opts) {
  const op = { opId: uid('op'), kind, data };
  queue.push(op);
  write(KEYS.queue, queue);
  applyOp(db, op);
  if (!opts || !opts.quiet) render();
  scheduleSync(250);
  return op;
}

function cfg() {
  const s = db.settings || {};
  return {
    payAmount: num(s.payAmount) > 0 ? num(s.payAmount) : DEFAULTS.payAmount,
    payAnchor: isDate(s.payAnchor) ? s.payAnchor : DEFAULTS.payAnchor,
    payEvery: num(s.payEvery) > 0 ? Math.round(num(s.payEvery)) : DEFAULTS.payEvery,
    defaultAccount: ACCOUNTS.some(a => a.id === s.defaultAccount) ? s.defaultAccount : DEFAULTS.defaultAccount,
    startDate: isDate(s.startDate) ? s.startDate : '',
  };
}

/* ================= sync with the Sheet ================= */
let syncTimer = 0;
function scheduleSync(ms) { clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms || 0); }

async function sync() {
  if (!conf.api || !conf.key) return false;
  if (net.syncing) { net.again = true; return false; }
  net.syncing = true;
  paintBar();
  const batch = queue.slice(0, 40);
  let ok = false;
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 25000);
    // No custom headers: keeps this a "simple" request, which Apps Script accepts from any site.
    const res = await fetch(conf.api, { method: 'POST', body: JSON.stringify({ key: conf.key, ops: batch }), signal: ctrl.signal });
    clearTimeout(timer);
    let data;
    try { data = await res.json(); } catch (_) { throw new Error('bad_response'); }
    if (!data || !data.ok) { const e = new Error((data && data.error) || 'server_error'); e.fromServer = true; throw e; }
    const sent = new Set(batch.map(o => o.opId));
    queue = queue.filter(o => !sent.has(o.opId));
    server = data.state;
    write(KEYS.queue, queue);
    write(KEYS.server, server);
    db = rebuild();
    net.error = '';
    net.last = Date.now();
    ok = true;
  } catch (e) {
    net.error = e.fromServer || e.message === 'bad_response' ? e.message : (navigator.onLine === false ? 'offline' : 'unreachable');
  }
  net.syncing = false;
  const again = net.again;
  net.again = false;
  render();
  if (ok && (again || queue.length)) scheduleSync(150);
  return ok;
}

function syncWords() {
  const n = queue.length;
  const waiting = n ? ` ${n} change${n === 1 ? '' : 's'} waiting to sync.` : '';
  if (net.syncing) return 'Syncing with your Sheet now.' + waiting;
  if (net.error) return errorWords(net.error) + waiting;
  if (n) return waiting.trim();
  if (net.last) return `Synced with your Sheet at ${new Date(net.last).toLocaleTimeString('en-CA', { hour: 'numeric', minute: '2-digit' })}.`;
  return 'Connected to your Sheet.';
}

function errorWords(code) {
  switch (code) {
    case 'bad_key': return 'The key doesn’t match. In Apps Script, run showKey and paste the key again.';
    case 'not_setup': return 'The script isn’t set up yet. In Apps Script, run setup first.';
    case 'bad_response': return 'That URL answered, but not like the budget script. Use the web app URL ending in /exec, with access set to Anyone.';
    case 'offline': return 'You’re offline. Entries are saved on your phone and will sync when you’re back online.';
    case 'unreachable': return 'Couldn’t reach your Sheet. Entries are saved on your phone and will sync when it’s reachable.';
    default: return `Your Sheet sent back an error: ${code}`;
  }
}

/* ================= money math ================= */
function balances() {
  let chequing = 0;
  const owing = {};
  CARDS.forEach(c => { owing[c.id] = 0; });
  db.tx.forEach(t => {
    const a = num(t.amount);
    if (t.type === 'expense') { if (t.account in owing) owing[t.account] += a; else chequing -= a; }
    else if (t.type === 'income') chequing += a;
    else if (t.type === 'transfer') { chequing -= a; if (t.account in owing) owing[t.account] -= a; }
    else if (t.type === 'adjust') { if (t.account === 'chequing') chequing += a; else if (t.account in owing) owing[t.account] += a; }
  });
  Object.keys(owing).forEach(k => { owing[k] = round2(owing[k]); });
  return { chequing: round2(chequing), owing, owingTotal: sum(Object.values(owing)) };
}

const billMonth = t => isMonth(t.forMonth) ? t.forMonth : monthOf(t.date);
const billPayments = (billId, mk) => db.tx.filter(t => t.type === 'expense' && num(t.amount) > 0 && t.billId === billId && billMonth(t) === mk);
const billCounts = (b, mk) => (!isMonth(b.start) || b.start <= mk) && (b.freq !== 'yearly' || num(b.month) === +mk.slice(5, 7));
const dueDate = (b, mk) => num(b.dueDay) >= 1 ? `${mk}-${pad(Math.min(num(b.dueDay), daysIn(mk)))}` : '';

function billsFor(mk) {
  const t = todayStr(), cur = monthOf(t);
  const rank = { overdue: 0, soon: 1, upcoming: 2, missed: 3, paid: 4 };
  return db.bills.filter(b => billCounts(b, mk)).map(b => {
    const paid = billPayments(b.id, mk);
    const due = dueDate(b, mk);
    let status = 'upcoming';
    if (paid.length) status = 'paid';
    else if (mk < cur) status = 'missed';
    else if (mk === cur && due && due < t) status = 'overdue';
    else if (mk === cur && due && dayNum(due) - dayNum(t) <= 3) status = 'soon';
    return { bill: b, paid, paidAmount: sum(paid, p => p.amount), due, status };
  }).sort((a, b) => rank[a.status] - rank[b.status] || (a.due || '9').localeCompare(b.due || '9') || String(a.bill.name).localeCompare(String(b.bill.name)));
}

function paydays(mk) {
  const s = cfg();
  const A = dayNum(s.payAnchor), step = s.payEvery;
  const start = dayNum(mk + '-01'), end = dayNum(`${mk}-${pad(daysIn(mk))}`);
  const out = [];
  for (let d = A + Math.ceil((start - A) / step) * step; d <= end; d += step) out.push(fromDayNum(d));
  return s.startDate ? out.filter(d => d >= s.startDate) : out;
}
function nextPayday(from) {
  const s = cfg();
  const A = dayNum(s.payAnchor), step = s.payEvery;
  return fromDayNum(A + Math.ceil((dayNum(from) - A) / step) * step);
}

function monthData(mk) {
  const txs = db.tx.filter(t => monthOf(t.date) === mk)
    .sort((a, b) => (String(b.date) + (b.created || '')).localeCompare(String(a.date) + (a.created || '')));
  const exp = txs.filter(t => t.type === 'expense');
  const inc = txs.filter(t => t.type === 'income');
  const spentBy = {};
  ACCOUNTS.forEach(a => { spentBy[a.id] = 0; });
  exp.forEach(t => { const k = t.account in spentBy ? t.account : 'other'; spentBy[k] = round2(spentBy[k] + num(t.amount)); });
  const byCat = {};
  exp.forEach(t => { const c = t.category || 'Other'; byCat[c] = round2((byCat[c] || 0) + num(t.amount)); });
  const bills = billsFor(mk);
  const unpaid = sum(bills.filter(b => b.status !== 'paid'), b => b.bill.amount);
  const days = paydays(mk);
  const cheques = inc.filter(t => t.category === 'Paycheque').sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const payLeft = Math.max(0, days.length - cheques.length);
  return {
    mk, txs, exp, inc, spentBy, byCat, bills, unpaid, days, cheques, payLeft,
    spent: sum(exp, t => t.amount), income: sum(inc, t => t.amount),
    payComing: round2(payLeft * cfg().payAmount),
  };
}

function firstMonth() {
  let m = monthOf(todayStr());
  const s = cfg().startDate;
  if (s && monthOf(s) < m) m = monthOf(s);
  db.tx.forEach(t => { if (isDate(t.date) && monthOf(t.date) < m) m = monthOf(t.date); });
  return m;
}

// Which month a bill payment counts for: the earliest month (this one or the next two)
// where the bill counts and hasn't been logged yet. Yearly ones use the nearest renewal.
function autoForMonth(b, dateStr) {
  const mk = monthOf(dateStr);
  if (b.freq === 'yearly') {
    const bm = num(b.month) || +mk.slice(5, 7);
    const y = +mk.slice(0, 4);
    const options = [y - 1, y, y + 1].map(yy => `${yy}-${pad(bm)}`)
      .sort((a, c) => Math.abs(monthDiff(a, mk)) - Math.abs(monthDiff(c, mk)));
    const best = options[0];
    return billPayments(b.id, best).length ? addMonths(best, 12) : best;
  }
  for (let i = 0; i < 3; i++) {
    const m = addMonths(mk, i);
    if (billCounts(b, m) && !billPayments(b.id, m).length) return m;
  }
  return mk;
}

/* ================= the draft entry ================= */
function newDraft(type) {
  type = type || 'expense';
  const d = { type, amount: '', prefilled: '', category: '', billId: '', forMonth: '', note: '', picking: false };
  if (type === 'income') { d.category = 'Paycheque'; d.amount = amtStr(cfg().payAmount); }
  return d;
}
// Drop the chosen bill; if its amount was filled in for you and you haven't touched it, drop that too.
function clearBill() {
  if (draft.billId && draft.prefilled && draft.amount === draft.prefilled) draft.amount = '';
  draft.billId = ''; draft.forMonth = ''; draft.prefilled = '';
}
const draftDate = () => todayStr();   // new entries are always today; fix a date later by tapping the entry
function primaryAccount() {
  const b = draft.billId && db.bills.find(x => x.id === draft.billId);
  return b && ACCOUNTS.some(a => a.id === b.account) ? b.account : cfg().defaultAccount;
}

/* ================= rendering ================= */
let deferred = false;
function currentView() {
  if (!conf.api || !conf.key || !server) return 'connect';
  if (!cfg().startDate) return 'start';
  return settingsOpen ? 'settings' : ui.view;
}

function render() {
  const a = document.activeElement;
  // Don't yank the keyboard away while someone is typing in a field on the page.
  if (a && a.closest && a.closest('#view') && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) {
    deferred = true;
    paintBar();
    return;
  }
  deferred = false;
  paintBar();
  paintView();
  paintNav();
}

function paintBar() {
  const v = currentView();
  let left;
  if (v === 'log') {
    left = `<div class="seg" role="group" aria-label="Entry type">${['expense', 'income', 'transfer', 'refund'].map(t =>
      `<button class="k-${t}" aria-pressed="${draft.type === t}" data-act="type:${t}">${cap(t)}</button>`).join('')}</div>`;
  } else if (v === 'settings') {
    left = `<button class="back" data-act="close-settings" aria-label="Back">${chev(-1)}<span>Settings</span></button>`;
  } else if (v === 'overview') left = '<span class="brand">Overview</span>';
  else if (v === 'debt') left = '<span class="brand">Debt</span>';
  else left = '<span class="brand">Budget</span>';
  const onboarding = v === 'connect' || v === 'start';
  const right = onboarding ? '' : syncPill(v === 'log') + (v === 'settings' ? '' : `<button class="iconbtn" data-act="settings" aria-label="Settings">${GEAR}</button>`);
  $('#bar').innerHTML = `${left}${v === 'log' ? '' : '<span class="grow"></span>'}${right}`;
}

// compact: the Log screen shares its top bar with the type switch, so it only shows a count there.
function syncPill(compact) {
  const n = queue.length;
  let cls = 'ok', text = '', label = 'Synced. Tap to sync now.';
  if (net.error === 'bad_key' || net.error === 'not_setup') { cls = 'bad'; text = compact ? '!' : 'Check key'; label = 'The Sheet rejected the key'; }
  else if (n) { cls = net.error ? 'warn' : 'busy'; text = compact ? String(n) : `${n} to sync`; label = `${n} change${n === 1 ? '' : 's'} waiting to sync. Tap to try now.`; }
  else if (net.error) { cls = 'warn'; text = compact ? '' : 'Offline'; label = 'Couldn’t reach the Sheet. Tap to try again.'; }
  if (net.syncing) cls += ' syncing';
  return `<button class="syncpill ${cls}" data-act="sync-now" aria-label="${label}"><i></i>${text ? `<span>${text}</span>` : ''}</button>`;
}

function paintNav() {
  const v = currentView();
  const nav = $('#nav');
  if (v === 'connect' || v === 'start' || v === 'settings') { nav.hidden = true; return; }
  nav.hidden = false;
  nav.innerHTML = [['log', 'Log'], ['overview', 'Overview'], ['debt', 'Debt']].map(([id, label]) =>
    `<button data-act="tab:${id}" ${ui.view === id ? 'aria-current="page"' : ''}>${label}</button>`).join('');
}

function paintView() {
  const v = currentView();
  const html = v === 'connect' ? viewConnect()
    : v === 'start' ? viewStart()
    : v === 'settings' ? viewSettings()
    : v === 'overview' ? viewOverview()
    : v === 'debt' ? viewDebt()
    : viewLog();
  $('#view').innerHTML = html;
  $$('#view details[data-key]').forEach(el => {
    el.addEventListener('toggle', () => { ui.open[el.dataset.key] = el.open; });
  });
}

/* ---------- strips ---------- */
function txStrip(t) {
  const a = num(t.amount);
  let main, where;
  const extra = [];
  if (t.type === 'expense') {
    main = esc(t.category || 'Other');
    where = t.account === 'other' && t.other ? esc(t.other) : acct(t.account).short;
    const b = t.billId && db.bills.find(x => x.id === t.billId);
    if (b) extra.push(esc(b.name) + (isMonth(t.forMonth) && t.forMonth !== monthOf(t.date) ? `, for ${monthName(t.forMonth)}` : ''));
    if (a < 0) extra.push('Refund');
  } else if (t.type === 'income') { main = esc(t.category || 'Income'); where = 'Chequing'; }
  else if (t.type === 'transfer') { main = `Paid off ${acct(t.account).short}`; where = 'Chequing'; }
  else { main = 'Balance fix'; where = acct(t.account).short; }
  if (t.note) extra.push(esc(t.note));
  const shown = t.type === 'income' ? '+' + moneyAbs(a)
    : t.type === 'adjust' ? (a < 0 ? '−' : '+') + moneyAbs(a)
    : (a < 0 ? '−' : '') + moneyAbs(a);
  return `<button class="strip t-${esc(t.type)}" data-act="edit:${esc(t.id)}">
    <span class="s-amt num">${shown}</span>
    <span class="s-main"><b>${main}</b>${extra.length ? `<small>${extra.join(', ')}</small>` : ''}</span>
    <span class="s-acct">${where}</span>
    <span class="s-date">${fmtDay(t.date)}</span>
  </button>`;
}

function billStrip(item, isCurrent) {
  const b = item.bill;
  const paid = item.status === 'paid';
  let when;
  if (paid) when = `Paid ${fmtDay(item.paid[0].date)}`;
  else if (item.status === 'missed') when = 'Not logged';
  else if (item.status === 'overdue') when = `Was due ${fmtDay(item.due)}`;
  else if (item.due) when = `Due ${fmtDay(item.due)}`;
  else when = 'This month';
  // Unpaid (this month): tap to log it. Paid: tap to open the payment and fix it.
  const tag = paid ? `data-act="edit:${esc(item.paid[0].id)}"` : (isCurrent ? `data-act="paybill:${esc(b.id)}"` : '');
  const el = tag ? 'button' : 'div';
  return `<${el} class="strip cols3 t-expense st-${item.status} ${paid ? '' : 'pending'}" ${tag}>
    <span class="s-amt num">${moneyAbs(paid ? item.paidAmount : b.amount)}</span>
    <span class="s-main"><b>${esc(b.name)}</b><small>${b.kind === 'sub' ? 'Subscription' : 'Bill'}</small></span>
    <span class="s-when">${when}</span>
  </${el}>`;
}

function payStrip(date, amount, received, label) {
  return `<div class="strip cols3 t-income ${received ? '' : 'pending'}">
    <span class="s-amt num">${received ? '+' : ''}${moneyAbs(amount)}</span>
    <span class="s-main"><b>${esc(label)}</b><small>${received ? 'Logged' : 'Expected'}</small></span>
    <span class="s-when">${fmtDay(date)}</span>
  </div>`;
}

/* ---------- Log ---------- */
function viewLog() {
  const d = draft, s = cfg();
  const amt = parseAmt(d.amount);
  const empty = !d.amount;
  const shown = empty ? '0' : d.amount;
  let pick = '', save = '';

  if (d.type === 'expense' || d.type === 'refund') {
    const refund = d.type === 'refund';
    pick = d.picking ? billPicker() : catGrid() + billLine();
    const ready = amt > 0 && d.category && !d.picking;
    const primary = primaryAccount();
    const verb = refund ? 'Refund to' : 'Save to';
    const hint = !(amt > 0) ? 'Enter an amount' : !d.category ? 'Pick a category' : d.picking ? 'Pick which one, or log it without one' : verb;
    save = `<div class="saveto ${ready ? '' : 'not-ready'}">
      <span class="lbl" id="save-hint">${hint}</span>
      <div class="accts" role="group" aria-labelledby="save-hint">${ACCOUNTS.map(a =>
        `<button class="acct ${a.id === primary ? 'primary' : ''}" data-act="save:${a.id}" aria-label="${verb} ${a.name}">${a.short}</button>`).join('')}</div>
    </div>`;
  } else if (d.type === 'income') {
    pick = `<div class="grid2">${INCOME_CATS.map(c => `<button class="tile" aria-pressed="${d.category === c}" data-act="inc:${c}">${c}${c === 'Paycheque' ? `<small class="num">usually ${moneyAbs(s.payAmount)}</small>` : '<small>goes into chequing</small>'}</button>`).join('')}</div>`;
    const ready = amt > 0 && d.category;
    save = `<div class="saveto ${ready ? '' : 'not-ready'}">
      <span class="lbl">${!(amt > 0) ? 'Enter an amount' : !d.category ? 'Pick a type' : 'Adds to chequing'}</span>
      <button class="btn primary block" data-act="save-income">Save income</button>
    </div>`;
  } else {
    const b = balances();
    pick = '<p class="explain">Moves money from chequing to a card. It lowers what you owe and isn’t counted as spending.</p>';
    const ready = amt > 0;
    save = `<div class="saveto ${ready ? '' : 'not-ready'}">
      <span class="lbl">${ready ? 'Pay off' : 'Enter an amount'}</span>
      <div class="accts three">${CARDS.map(c =>
        `<button class="acct" data-act="transfer:${c.id}" aria-label="Pay off ${c.name}">${c.short}<small class="num">owes ${money(b.owing[c.id])}</small></button>`).join('')}</div>
    </div>`;
  }

  const meta = `<div class="meta">
    <input class="note" data-in="note" placeholder="Note (optional)" value="${esc(d.note)}" maxlength="80" enterkeyhint="done" aria-label="Note">
  </div>`;

  const recent = db.tx.filter(t => t.type !== 'adjust')
    .sort((a, b) => String(b.created || '').localeCompare(String(a.created || '')))
    .slice(0, 5);

  return `
  <section class="log" aria-label="Log an entry">
    <div class="amount-row">
      <div class="amount ${empty ? 'is-empty' : ''} ${d.type === 'refund' ? 'is-refund' : ''}" aria-live="polite">${d.type === 'refund' ? '−' : ''}<span class="cur">$</span>${esc(shown)}</div>
    </div>
    <div class="keypad">${['1', '2', '3', 'back', '4', '5', '6', '7', '8', '9', 'clear', '0', '.'].map(k =>
      k === 'back' ? `<button class="k-back" data-act="key:back" aria-label="Delete last digit">${BACKSPACE}</button>`
        : k === 'clear' ? '<button class="k-clear" data-act="key:clear" aria-label="Clear the amount">Clear</button>'
        : `<button class="${k === '0' ? 'k-zero' : ''}" data-act="key:${k}" aria-label="${k === '.' ? 'Decimal point' : k}">${k}</button>`).join('')}</div>
    ${pick}
    ${meta}
    ${save}
  </section>
  <section class="recent">
    <h2>Recent</h2>
    ${recent.length ? `<div class="strips">${recent.map(txStrip).join('')}</div>` : '<p class="empty">Your last five entries show up here. Tap one to change or delete it.</p>'}
  </section>`;
}

function catGrid() {
  return `<div class="grid3" role="group" aria-label="Category">${EXPENSE_CATS.map(c =>
    `<button class="tile" aria-pressed="${draft.category === c}" data-act="cat:${c}">${c}</button>`).join('')}</div>`;
}

function billLine() {
  const b = draft.billId && db.bills.find(x => x.id === draft.billId);
  if (!b) return '';
  return `<div class="billsel">
    <div><b>${esc(b.name)}</b>counts for ${monthName(draft.forMonth)}</div>
    <button class="mini" data-act="formonth:-1" aria-label="Count it for the month before">${chev(-1)}</button>
    <button class="mini" data-act="formonth:1" aria-label="Count it for the month after">${chev(1)}</button>
    <button class="mini" data-act="bill:change" style="padding:0 8px">Change</button>
  </div>`;
}

function billPicker() {
  const kind = BILL_KIND[draft.category];
  const word = kind === 'sub' ? 'subscription' : 'bill';
  const items = db.bills.filter(b => b.kind === kind).sort((a, b) => (num(a.dueDay) || 99) - (num(b.dueDay) || 99) || String(a.name).localeCompare(String(b.name)));
  const tiles = items.map(b => {
    const fm = autoForMonth(b, draftDate());
    const paidNow = billPayments(b.id, monthOf(draftDate())).length > 0;
    const note = paidNow ? (fm !== monthOf(draftDate()) ? `paid, next is ${MON[+fm.slice(5, 7) - 1]}` : 'paid this month') : moneyAbs(b.amount);
    return `<button class="tile ${paidNow ? 'paid' : ''}" data-act="bill:${esc(b.id)}">${esc(b.name)}<small class="num">${note}</small></button>`;
  }).join('');
  return `<div class="picker">
    <div class="picker-head"><b>Which ${word}?</b><button class="linkbtn" data-act="bill:back">Back</button></div>
    ${items.length ? `<div class="grid2">${tiles}</div>` : `<p class="explain">No ${word}s yet. Add them in settings so they count as still to pay.</p>`}
    <button class="linkbtn" data-act="bill:none">Log it without picking one</button>
  </div>`;
}

/* ---------- Overview ---------- */
function viewOverview() {
  const today = todayStr(), cur = monthOf(today);
  const mk = ui.month && ui.month <= cur ? ui.month : cur;
  const isCur = mk === cur;
  const m = monthData(mk);
  const first = firstMonth();
  const s = cfg();
  let out = `<section class="ov">
    <div class="mnav">
      <button class="arrow" data-act="month:-1" ${mk <= first ? 'disabled' : ''} aria-label="Previous month">${chev(-1)}</button>
      <h1>${monthLabel(mk)}</h1>
      <button class="arrow" data-act="month:1" ${isCur ? 'disabled' : ''} aria-label="Next month">${chev(1)}</button>
    </div>`;

  if (isCur) {
    const b = balances();
    const left = daysIn(mk) - +today.slice(8, 10);
    const np = nextPayday(today);
    out += `<p class="sub">${left === 0 ? 'Last day of the month' : `${left} day${left === 1 ? '' : 's'} left`}. Next pay ${np === today ? 'today' : fmtDay(np)}.</p>
    <div class="ledger">
      <div class="lrow"><span>Chequing (estimated)</span><span class="num">${money(b.chequing)}</span></div>
      <div class="lrow"><span>Cards owing</span><span class="num">${less(b.owingTotal)}</span></div>
      <div class="lrow"><span>Bills and subscriptions left</span><span class="num">${less(m.unpaid)}</span></div>
      <div class="lrow"><span>Remaining anticipated income</span><span class="num">${more(m.payComing)}</span></div>
      <div class="lrow total"><span>Balance</span><span class="num ${b.chequing - b.owingTotal - m.unpaid + m.payComing < 0 ? 'neg' : ''}">${money(b.chequing - b.owingTotal - m.unpaid + m.payComing)}</span></div>
    </div>`;
  } else {
    out += `<p class="sub">Month closed</p>
    <div class="ledger">
      <div class="lrow"><span>Income</span><span class="num">${more(m.income)}</span></div>
      <div class="lrow"><span>Spent</span><span class="num">${less(m.spent)}</span></div>
      <div class="lrow total"><span>Left over</span><span class="num ${m.income - m.spent < 0 ? 'neg' : ''}">${money(m.income - m.spent)}</span></div>
    </div>`;
  }

  // Spending by account
  const owing = isCur ? balances().owing : null;
  out += `<h2>Spent in ${monthName(mk)}<span class="num">${money(m.spent)}</span></h2>
  <table class="atable">
    <thead><tr><th>Account</th><th>Spent</th>${isCur ? '<th>Owing now</th>' : ''}</tr></thead>
    <tbody>${ACCOUNTS.map(a => `<tr><td>${a.name}</td><td>${money(m.spentBy[a.id])}</td>${isCur ? `<td>${a.card ? money(owing[a.id]) : ''}</td>` : ''}</tr>`).join('')}</tbody>
  </table>`;

  // Bills and subscriptions
  const unpaidCount = m.bills.filter(x => x.status !== 'paid').length;
  out += `<h2>Bills and subscriptions${m.bills.length ? `<span class="muted" style="font-size:14px;font-weight:500">${isCur ? `${unpaidCount} of ${m.bills.length} left` : `${m.bills.length - unpaidCount} of ${m.bills.length} logged`}</span>` : ''}</h2>`;
  if (m.bills.length) {
    out += `<div class="strips">${m.bills.map(x => billStrip(x, isCur)).join('')}</div>`;
    if (isCur && unpaidCount) out += '<p class="explain" style="margin-top:8px">Tap a dashed one to log it.</p>';
  } else {
    out += `<p class="empty">Add your bills and subscriptions in settings so they count toward your balance.</p>
      <button class="btn small" style="margin-top:8px" data-act="settings">Open settings</button>`;
  }

  // Pay and other income
  const strips = [];
  m.days.forEach((day, i) => {
    const got = m.cheques[i];
    strips.push(got ? payStrip(got.date, got.amount, true, 'Paycheque') : payStrip(day, s.payAmount, false, 'Paycheque'));
  });
  m.cheques.slice(m.days.length).forEach(c => strips.push(payStrip(c.date, c.amount, true, 'Paycheque')));
  m.inc.filter(t => t.category !== 'Paycheque').forEach(t => strips.push(payStrip(t.date, t.amount, true, t.category || 'Other income')));
  out += `<h2>Pay${m.income ? `<span class="num">${more(m.income)}</span>` : ''}</h2>`;
  out += strips.length ? `<div class="strips">${strips.join('')}</div>` : '<p class="empty">No paydays this month.</p>';

  // By category
  const cats = Object.entries(m.byCat).filter(([, v]) => round2(v) !== 0).sort((a, b) => b[1] - a[1]);
  out += `<details data-key="cats-${mk}" ${ui.open['cats-' + mk] ? 'open' : ''}><summary>Where it went</summary>
    ${cats.length ? cats.map(([c, v]) => `<div class="catrow"><span>${esc(c)}</span><span class="num">${money(v)}</span></div>`).join('') : '<p class="empty">Nothing spent yet.</p>'}
  </details>`;

  // All entries
  out += `<details data-key="tx-${mk}" ${ui.open['tx-' + mk] ? 'open' : ''}><summary>All entries<span>${m.txs.length}</span></summary>
    ${m.txs.length ? `<div class="strips">${m.txs.map(txStrip).join('')}</div>` : '<p class="empty">Nothing logged this month.</p>'}
  </details>`;

  if (isCur) out += '<button class="btn block" data-act="fix">Fix balances</button>';
  return out + '</section>';
}

/* ---------- Debt ---------- */
function viewDebt() {
  const debts = db.debts.slice().sort((a, b) => num(a.order) - num(b.order));
  const total = sum(debts, d => d.balance);
  const log = db.debtLog.slice().sort((a, b) => String(b.created || '').localeCompare(String(a.created || ''))).slice(0, 8);
  let out = `<section class="debtv">
    <div class="total-line"><span>Total owed</span><span class="num">${money(total)}</span></div>`;
  out += debts.map(d => {
    const bal = num(d.balance), rate = num(d.rate);
    const updated = String(d.updated || '').slice(0, 10);
    const meta = [];
    if (rate > 0) meta.push(`${rate}% interest, about ${moneyAbs(bal * rate / 100 / 12)} a month`);
    if (isDate(updated)) meta.push(`updated ${fmtDay(updated)}`);
    return `<div class="debt">
      <div class="debt-head"><b>${esc(d.name)}</b><button class="linkbtn" data-act="debt-edit:${esc(d.id)}">Edit</button></div>
      <div class="debt-bal num">${money(bal)}</div>
      <div class="debt-meta">${bal === 0 && rate === 0 ? 'Tap Edit to enter the balance and interest rate.' : cap(meta.join(', ') || '')}</div>
      <button class="btn primary block" data-act="debt-pay:${esc(d.id)}">Subtract a payment</button>
    </div>`;
  }).join('');
  if (!debts.length) out += '<p class="empty" style="margin-top:12px">No debts. Nice.</p>';
  out += '<button class="btn block" style="margin-top:12px" data-act="debt-new">Add a debt</button>';
  if (log.length) {
    out += `<h2>Recent payments</h2>${log.map(p => {
      const d = db.debts.find(x => x.id === p.debtId);
      return `<div class="payrow"><span>${fmtDay(p.date)}</span><span>${esc(d ? d.name : 'Removed debt')}</span><span class="num">${less(p.amount)}</span><button class="linkbtn" data-act="debt-unpay:${esc(p.id)}">Undo</button></div>`;
    }).join('')}`;
  }
  out += '<p class="explain">Separate from your budget. Payments here only change these balances, so nothing gets counted twice.</p>';
  return out + '</section>';
}

/* ---------- Settings ---------- */
function billWhen(b) {
  const kind = b.kind === 'sub' ? 'Subscription' : 'Bill';
  const day = num(b.dueDay) >= 1 ? `, due the ${ordinal(num(b.dueDay))}` : '';
  const freq = b.freq === 'yearly' ? `yearly in ${MONTHS[(num(b.month) || 1) - 1]}` : 'monthly';
  return `${kind}, ${freq}${day}`;
}

  const s = cfg();
  const items = db.bills.slice().sort((a, b) => String(a.kind).localeCompare(String(b.kind)) || (num(a.dueDay) || 99) - (num(b.dueDay) || 99) || String(a.name).localeCompare(String(b.name)));
  return `<div class="settings">
  <section>
    <h2>Bills and subscriptions</h2>
    <div class="rows">${items.length ? items.map(b => `<button class="row" data-act="bill-edit:${esc(b.id)}"><span><b>${esc(b.name)}</b><small>${billWhen(b)}</small></span><span class="num">${money(b.amount)}</span></button>`).join('') : '<p class="empty">Nothing added yet. These count as still to pay each month until you log them.</p>'}</div>
    <button class="btn block" data-act="bill-new">Add a bill or subscription</button>
  </section>
  <section>
    <h2>Pay</h2>
    <div class="pair">
      <label class="field"><span>Usual paycheque</span><input id="set-pay" inputmode="decimal" value="${amtStr(s.payAmount)}"></label>
      <label class="field"><span>Any payday</span><input id="set-anchor" type="date" value="${s.payAnchor}"></label>
    </div>
    <p class="explain" style="margin-top:0">Paid every two weeks from that day. Next pay is ${fmtDay(nextPayday(todayStr()))}.</p>
    <button class="btn block" style="margin-top:10px" data-act="save-pay">Save pay</button>
  </section>
  <section>
    <h2>Logging</h2>
    <label class="field"><span>Account picked by default</span><select data-in="defaultAccount">${ACCOUNTS.map(a => `<option value="${a.id}" ${a.id === s.defaultAccount ? 'selected' : ''}>${a.name}</option>`).join('')}</select></label>
  </section>
  <section>
    <h2>Balances</h2>
    <p class="explain" style="margin:0 2px 10px">If chequing or a card drifts from what your bank shows, correct it here.</p>
    <button class="btn block" data-act="fix">Fix balances</button>
  </section>
  <section>
    <h2>Connection</h2>
    <p class="explain" style="margin:0 2px 10px">${esc(syncWords())}</p>
    <button class="btn block" data-act="sync-now">Sync now</button>
    <details data-key="conn" ${ui.open.conn ? 'open' : ''}><summary>Change Sheet URL or key</summary>
      <label class="field"><span>Web app URL</span><input id="set-api" type="url" value="${esc(conf.api)}" autocomplete="off"></label>
      <label class="field"><span>Key</span><input id="set-key" value="${esc(conf.key)}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <button class="btn block" data-act="save-conn">Save and reconnect</button>
    </details>
  </section>
  <p class="foot">Budget ${VERSION}. Everything is stored in your Google Sheet.</p>
  </div>`;
}
