/* ================= sheets (bottom panels) ================= */
function openSheet(html, mount) {
  const el = $('#sheet');
  el.innerHTML = '<div class="grab"></div>' + html;
  el.hidden = false;
  $('#scrim').hidden = false;
  if (!sheetOpen) { history.pushState({ overlay: 'sheet' }, ''); sheetOpen = true; }
  el.scrollTop = 0;
  if (mount) mount(el);
}
function closeSheet() { if (sheetOpen) history.back(); }
function hideSheet() {
  sheetOpen = false;
  $('#sheet').hidden = true;
  $('#scrim').hidden = true;
  $('#sheet').innerHTML = '';
}
window.addEventListener('popstate', () => {
  if (sheetOpen) { hideSheet(); if (deferred) render(); return; }
  if (settingsOpen) { settingsOpen = false; render(); window.scrollTo(0, 0); }
});

function field(label, inner) { return `<label class="field"><span>${label}</span>${inner}</label>`; }
function options(list, value) {
  return list.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(value) ? 'selected' : ''}>${esc(l)}</option>`; }).join('');
}
const sv = (el, name) => { const x = el.querySelector(`[data-f="${name}"]`); return x ? (x.type === 'checkbox' ? x.checked : x.value) : undefined; };
function armDelete(btn, onConfirm) {
  if (btn.dataset.armed) { onConfirm(); return; }
  btn.dataset.armed = '1';
  btn.textContent = 'Tap again to delete';
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = 'Delete'; } }, 3500);
}

function editTxSheet(id) {
  const t = db.tx.find(x => x.id === id);
  if (!t) return;
  const a = num(t.amount);
  const title = { expense: 'Edit expense', income: 'Edit income', transfer: 'Edit card payment', adjust: 'Edit balance fix' }[t.type] || 'Edit entry';
  let f = '';
  if (t.type === 'adjust') {
    f += field('Correction (use a minus for a decrease)', `<input data-f="amount" inputmode="text" value="${a}">`);
  } else {
    f += field('Amount', `<input data-f="amount" inputmode="decimal" value="${amtStr(a)}">`);
  }
  if (t.type === 'expense') {
    f += `<label class="check"><input type="checkbox" data-f="refund" ${a < 0 ? 'checked' : ''}> This was a refund</label>`;
    f += field('Category', `<select data-f="category">${options(EXPENSE_CATS, t.category)}</select>`);
    const billOpts = [['', 'None']].concat(db.bills.slice().sort((x, y) => String(x.name).localeCompare(String(y.name))).map(b => [b.id, `${b.name} (${b.kind === 'sub' ? 'subscription' : 'bill'})`]));
    const base = monthOf(t.date);
    const months = [-1, 0, 1].map(i => addMonths(base, i));
    const fm = isMonth(t.forMonth) ? t.forMonth : base;
    if (!months.includes(fm)) months.push(fm);
    f += `<div data-billfields class="pair">
      ${field('Which one', `<select data-f="billId">${options(billOpts, t.billId)}</select>`)}
      ${field('Counts for', `<select data-f="forMonth">${options(months.map(mk => [mk, monthLabel(mk)]), fm)}</select>`)}
    </div>`;
    f += field('Account', `<select data-f="account">${options(ACCOUNTS.map(x => [x.id, x.name]), t.account)}</select>`);
    f += `<div data-otherfield>${field('Paid with', `<input data-f="other" value="${esc(t.other)}" placeholder="Cash, gift card...">`)}</div>`;
  } else if (t.type === 'income') {
    f += field('Type', `<select data-f="category">${options(INCOME_CATS, t.category)}</select>`);
  } else if (t.type === 'transfer') {
    f += field('Card paid off', `<select data-f="account">${options(CARDS.map(x => [x.id, x.name]), t.account)}</select>`);
  } else if (t.type === 'adjust') {
    f += field('Account', `<select data-f="account">${options([['chequing', 'Chequing']].concat(CARDS.map(x => [x.id, x.name])), t.account)}</select>`);
  }
  f += field('Date', `<input type="date" data-f="date" value="${esc(t.date)}">`);
  f += field('Note', `<input data-f="note" value="${esc(t.note)}" maxlength="80">`);
  openSheet(`<h2>${title}</h2>${f}
    <div class="actions">
      <button class="btn primary block" data-act="tx-save:${esc(id)}">Save changes</button>
      <button class="btn danger block" data-act="tx-del:${esc(id)}">Delete</button>
    </div>`, el => {
    const sync = () => {
      const cat = sv(el, 'category');
      const bf = el.querySelector('[data-billfields]');
      if (bf) bf.hidden = !(cat in BILL_KIND);
      const of = el.querySelector('[data-otherfield]');
      if (of) of.hidden = sv(el, 'account') !== 'other';
    };
    el.addEventListener('change', sync);
    sync();
  });
}

function saveTxEdit(id) {
  const t = db.tx.find(x => x.id === id);
  if (!t) return closeSheet();
  const el = $('#sheet');
  const raw = sv(el, 'amount');
  let amount = t.type === 'adjust' ? round2(parseFloat(String(raw).replace(/[^0-9.\-]/g, ''))) : parseAmt(raw);
  if (!Number.isFinite(amount) || (t.type !== 'adjust' && !(amount > 0))) return nudge(el.querySelector('[data-f="amount"]'), 'Enter an amount above zero');
  const next = Object.assign({}, t, { date: isDate(sv(el, 'date')) ? sv(el, 'date') : t.date, note: String(sv(el, 'note') || '').trim() });
  if (t.type === 'expense') {
    next.amount = sv(el, 'refund') ? -Math.abs(amount) : Math.abs(amount);
    next.category = sv(el, 'category');
    next.account = sv(el, 'account');
    next.other = next.account === 'other' ? String(sv(el, 'other') || '').trim() : '';
    if (next.category in BILL_KIND) { next.billId = sv(el, 'billId') || ''; next.forMonth = next.billId ? sv(el, 'forMonth') : ''; }
    else { next.billId = ''; next.forMonth = ''; }
  } else {
    next.amount = amount;
    if (t.type === 'income') next.category = sv(el, 'category');
    if (t.type === 'transfer' || t.type === 'adjust') next.account = sv(el, 'account');
  }
  commit('tx.put', next);
  closeSheet();
  toast('Changes saved');
}

function otherAccountSheet() {
  openSheet(`<h2>Paid with</h2>
    <div class="quick">${['Cash', 'Gift card', 'E-transfer'].map(q => `<button class="chip" data-act="other-quick:${q}">${q}</button>`).join('')}</div>
    ${field('Or type it', '<input data-f="other" maxlength="40" placeholder="What did you pay with?" enterkeyhint="done">')}
    <div class="actions"><button class="btn primary block" data-act="other-save">Save</button></div>`);
}

function billSheet(id) {
  const b = id ? db.bills.find(x => x.id === id) : null;
  const cur = monthOf(todayStr());
  const v = b || { name: '', kind: 'bill', amount: '', dueDay: '', freq: 'monthly', month: +cur.slice(5, 7), account: cfg().defaultAccount, start: cur };
  const startOpts = [cur, addMonths(cur, 1)];
  if (isMonth(v.start) && !startOpts.includes(v.start)) startOpts.unshift(v.start);
  openSheet(`<h2>${b ? 'Edit' : 'Add a bill or subscription'}${b ? ` ${esc(b.name)}` : ''}</h2>
    ${field('Name', `<input data-f="name" value="${esc(v.name)}" maxlength="40" placeholder="Rent, phone, Netflix...">`)}
    <div class="pair">
      ${field('Type', `<select data-f="kind">${options([['bill', 'Bill'], ['sub', 'Subscription']], v.kind)}</select>`)}
      ${field('Amount', `<input data-f="amount" inputmode="decimal" value="${v.amount === '' ? '' : amtStr(v.amount)}" placeholder="0.00">`)}
    </div>
    <div class="pair">
      ${field('Repeats', `<select data-f="freq">${options([['monthly', 'Monthly'], ['yearly', 'Yearly']], v.freq)}</select>`)}
      ${field('Due day (optional)', `<input data-f="dueDay" inputmode="numeric" value="${num(v.dueDay) >= 1 ? num(v.dueDay) : ''}" placeholder="1 to 31">`)}
    </div>
    <div data-monthfield>${field('Renews in', `<select data-f="month">${options(MONTHS.map((n, i) => [i + 1, n]), num(v.month) || +cur.slice(5, 7))}</select>`)}</div>
    ${field('Usually paid with', `<select data-f="account">${options(ACCOUNTS.map(x => [x.id, x.name]), v.account || cfg().defaultAccount)}</select>`)}
    ${field('Count it from', `<select data-f="start">${options(startOpts.map(mk => [mk, mk === cur ? `This month (${monthName(mk)})` : mk === addMonths(cur, 1) ? `Next month (${monthName(mk)})` : monthLabel(mk)]), isMonth(v.start) ? v.start : cur)}</select>`)}
    <p class="explain" style="margin-top:0">Already paid it this month before you started using the app? Pick next month so it isn’t counted twice.</p>
    <div class="actions">
      <button class="btn primary block" data-act="bill-save:${esc(id || '')}">Save</button>
      ${b ? `<button class="btn danger block" data-act="bill-del:${esc(id)}">Delete</button>` : ''}
    </div>`, el => {
    let startTouched = !!b;
    const startSel = el.querySelector('[data-f="start"]');
    startSel.addEventListener('change', () => { startTouched = true; });
    const update = () => {
      el.querySelector('[data-monthfield]').hidden = sv(el, 'freq') !== 'yearly';
      // If the due day has already passed this month, it's probably paid: suggest next month.
      if (!startTouched && sv(el, 'freq') === 'monthly') {
        const dd = parseInt(sv(el, 'dueDay'), 10);
        startSel.value = dd >= 1 && dd < +todayStr().slice(8, 10) ? addMonths(cur, 1) : cur;
      }
    };
    el.addEventListener('input', update);
    el.addEventListener('change', update);
    update();
  });
}

function saveBill(id) {
  const el = $('#sheet');
  const name = String(sv(el, 'name') || '').trim();
  const amount = parseAmt(sv(el, 'amount'));
  if (!name) return nudge(el.querySelector('[data-f="name"]'), 'Give it a name');
  if (!(amount > 0)) return nudge(el.querySelector('[data-f="amount"]'), 'Enter the usual amount');
  let due = parseInt(sv(el, 'dueDay'), 10);
  due = due >= 1 && due <= 31 ? due : '';
  const freq = sv(el, 'freq') === 'yearly' ? 'yearly' : 'monthly';
  const existing = id ? db.bills.find(x => x.id === id) : null;
  const bill = {
    id: id || uid('b'), name, kind: sv(el, 'kind') === 'sub' ? 'sub' : 'bill', amount, dueDay: due, freq,
    month: freq === 'yearly' ? num(sv(el, 'month')) : '', account: sv(el, 'account'),
    start: isMonth(sv(el, 'start')) ? sv(el, 'start') : (existing && existing.start) || monthOf(todayStr()),
  };
  commit('bill.put', bill);
  closeSheet();
  toast(existing ? 'Saved' : `Added ${name}`);
}

function debtSheet(id) {
  const d = id ? db.debts.find(x => x.id === id) : null;
  openSheet(`<h2>${d ? 'Edit debt' : 'Add a debt'}</h2>
    ${field('Name', `<input data-f="name" value="${esc(d ? d.name : '')}" maxlength="40" placeholder="Car loan">`)}
    <div class="pair">
      ${field('Balance owing', `<input data-f="balance" inputmode="decimal" value="${d ? amtStr(d.balance) : ''}" placeholder="0.00">`)}
      ${field('Interest rate (%)', `<input data-f="rate" inputmode="decimal" value="${d && num(d.rate) ? num(d.rate) : ''}" placeholder="0">`)}
    </div>
    <div class="actions">
      <button class="btn primary block" data-act="debt-save:${esc(id || '')}">Save</button>
      ${d ? `<button class="btn danger block" data-act="debt-del:${esc(id)}">Delete</button>` : ''}
    </div>`);
}

function saveDebt(id) {
  const el = $('#sheet');
  const name = String(sv(el, 'name') || '').trim();
  if (!name) return nudge(el.querySelector('[data-f="name"]'), 'Give it a name');
  const d = id ? db.debts.find(x => x.id === id) : null;
  const order = d ? d.order : db.debts.reduce((m, x) => Math.max(m, num(x.order)), 0) + 1;
  commit('debt.put', { id: id || uid('d'), name, balance: parseAmt(sv(el, 'balance')), rate: parseAmt(sv(el, 'rate')), updated: new Date().toISOString(), order });
  closeSheet();
  toast('Saved');
}

function debtPaySheet(id) {
  const d = db.debts.find(x => x.id === id);
  if (!d) return;
  openSheet(`<h2>Subtract from ${esc(d.name)}</h2>
    <p class="explain" style="margin-top:0">Now ${money(d.balance)}.</p>
    <div class="pair">
      ${field('Payment', '<input data-f="amount" inputmode="decimal" placeholder="0.00">')}
      ${field('Date', `<input type="date" data-f="date" value="${todayStr()}" max="${todayStr()}">`)}
    </div>
    <div class="actions"><button class="btn primary block" data-act="debt-pay-save:${esc(id)}">Subtract payment</button></div>`,
  el => { const i = el.querySelector('[data-f="amount"]'); setTimeout(() => i.focus(), 80); });
}

function fixSheet() {
  const b = balances();
  const rows = [['chequing', 'Chequing balance', b.chequing]].concat(CARDS.map(c => [c.id, `${c.name} owing`, b.owing[c.id]]));
  openSheet(`<h2>Fix balances</h2>
    <p class="explain" style="margin-top:0">Type what your bank or card app shows. Leave a box empty if it already matches.</p>
    ${rows.map(([id, label, val]) => `<label class="field"><span>${label}</span><input data-fix="${id}" inputmode="decimal" placeholder="${amtStr(val)}"><small>App has ${money(val)}</small></label>`).join('')}
    <div class="actions"><button class="btn primary block" data-act="fix-save">Save</button></div>`);
}

// Adds one correction entry per account whose real number differs from the app's.
function applyFixes(container) {
  const b = balances();
  const now = new Date().toISOString();
  let n = 0;
  $$('[data-fix]', container).forEach(inp => {
    const raw = String(inp.value || '').trim();
    if (!raw) return;
    const actual = round2(parseFloat(raw.replace(/[^0-9.\-]/g, '')));
    if (!Number.isFinite(actual)) return;
    const id = inp.dataset.fix;
    const currentVal = id === 'chequing' ? b.chequing : b.owing[id];
    const diff = round2(actual - currentVal);
    if (diff === 0) return;
    commit('tx.put', { id: uid('t'), date: todayStr(), type: 'adjust', amount: diff, category: 'Balance fix', account: id, other: '', billId: '', forMonth: '', note: '', created: now }, { quiet: true });
    n++;
  });
  return n;
}

/* ================= toast ================= */
let toastTimer = 0, toastAction = null;
function toast(msg, actionLabel, action) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${actionLabel ? `<button data-act="toast">${esc(actionLabel)}</button>` : ''}`;
  el.classList.add('show');
  toastAction = action || null;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); toastAction = null; }, action ? 6000 : 2600);
}
function nudge(el, msg) {
  if (msg) toast(msg);
  if (!el) return;
  el.classList.remove('nudge');
  void el.offsetWidth;
  el.classList.add('nudge');
  if (el.focus && /^(INPUT|SELECT)$/.test(el.tagName)) el.focus();
}

/* ================= saving entries ================= */
function finishSave(tx, msg) {
  const keepType = 'expense';
  draft = newDraft(keepType);
  if (navigator.vibrate) { try { navigator.vibrate(12); } catch (_) {} }
  commit('tx.put', tx);
  toast(msg, 'Undo', () => { commit('tx.del', { id: tx.id }); toast('Removed'); });
  window.scrollTo({ top: 0 });
}

function saveExpense(accountId, other) {
  const amt = parseAmt(draft.amount);
  if (!(amt > 0)) return nudge($('.amount'), 'Enter an amount first');
  if (!draft.category) return nudge($('.grid3'), 'Pick a category first');
  if (draft.picking) return nudge($('.picker'), 'Pick which one, or log it without one');
  if (accountId === 'other' && other === undefined) return otherAccountSheet();
  const tx = {
    id: uid('t'), date: draftDate(), type: 'expense', amount: draft.type === 'refund' ? -amt : amt,
    category: draft.category, account: accountId, other: accountId === 'other' ? (other || '') : '',
    billId: draft.billId || '', forMonth: draft.billId ? draft.forMonth : '', note: draft.note.trim(),
    created: new Date().toISOString(),
  };
  const where = accountId === 'other' ? (other || 'Other') : acct(accountId).name;
  finishSave(tx, draft.type === 'refund' ? `Refund of ${moneyAbs(amt)} back to ${where}` : `Saved ${moneyAbs(amt)} to ${where}`);
}

function saveIncome() {
  const amt = parseAmt(draft.amount);
  if (!(amt > 0)) return nudge($('.amount'), 'Enter an amount first');
  if (!draft.category) return nudge($('.grid2'), 'Pick a type first');
  finishSave({
    id: uid('t'), date: draftDate(), type: 'income', amount: amt, category: draft.category, account: 'chequing',
    other: '', billId: '', forMonth: '', note: draft.note.trim(), created: new Date().toISOString(),
  }, `Saved ${moneyAbs(amt)} ${draft.category === 'Paycheque' ? 'paycheque' : 'income'}`);
}

function saveTransfer(card) {
  const amt = parseAmt(draft.amount);
  if (!(amt > 0)) return nudge($('.amount'), 'Enter an amount first');
  finishSave({
    id: uid('t'), date: draftDate(), type: 'transfer', amount: amt, category: 'Card payment', account: card,
    other: '', billId: '', forMonth: '', note: draft.note.trim(), created: new Date().toISOString(),
  }, `Paid ${moneyAbs(amt)} to ${acct(card).name}`);
}

function pressKey(k) {
  let s = draft.amount;
  if (k === 'back') s = s.slice(0, -1);
  else if (k === 'clear') s = '';
  else if (k === '.') { if (!s.includes('.')) s = (s || '0') + '.'; }
  else {
    if (s.includes('.') && s.split('.')[1].length >= 2) return nudge($('.amount'));
    if (s === '0') s = '';
    if (s.replace('.', '').length >= 7) return nudge($('.amount'));
    s += k;
  }
  draft.amount = s;
  render();
}

/* ================= actions ================= */
const actions = {
  'tab': v => { ui.view = v; if (v === 'overview') ui.month = ''; render(); window.scrollTo(0, 0); },
  'type': t => {
    if (draft.type === t) return;
    clearBill();
    const keep = { amount: draft.amount, note: draft.note };
    draft = newDraft(t);
    if (parseAmt(keep.amount) > 0) draft.amount = keep.amount;   // never throw away a typed amount
    draft.note = keep.note;
    render();
  },
  'key': k => pressKey(k),
  'cat': c => {
    clearBill();
    draft.category = c;
    draft.picking = draft.type === 'expense' && c in BILL_KIND;
    render();
  },
  'bill': arg => {
    if (arg === 'back') { clearBill(); draft.picking = false; draft.category = ''; }
    else if (arg === 'none') { clearBill(); draft.picking = false; }
    else if (arg === 'change') { clearBill(); draft.picking = true; }
    else {
      const b = db.bills.find(x => x.id === arg);
      if (!b) return;
      draft.billId = b.id;
      draft.forMonth = autoForMonth(b, draftDate());
      draft.picking = false;
      if (!(parseAmt(draft.amount) > 0)) { draft.amount = amtStr(b.amount); draft.prefilled = draft.amount; }
    }
    render();
  },
  'formonth': dir => { if (draft.forMonth) { draft.forMonth = addMonths(draft.forMonth, +dir); render(); } },
  'inc': c => {
    draft.category = c;
    if (c === 'Paycheque' && !(parseAmt(draft.amount) > 0)) draft.amount = amtStr(cfg().payAmount);
    render();
  },
  'save': id => saveExpense(id),
  'save-income': () => saveIncome(),
  'transfer': card => saveTransfer(card),
  'other-quick': q => { closeSheet(); saveExpense('other', q); },
  'other-save': () => { const v = String(sv($('#sheet'), 'other') || '').trim(); closeSheet(); saveExpense('other', v || 'Other'); },
  'edit': id => editTxSheet(id),
  'tx-save': id => saveTxEdit(id),
  'tx-del': (id, btn) => armDelete(btn, () => { commit('tx.del', { id }); closeSheet(); toast('Deleted'); }),
  'toast': () => { const f = toastAction; toastAction = null; $('#toast').classList.remove('show'); if (f) f(); },
  'month': dir => {
    const cur = monthOf(todayStr());
    const m = addMonths(ui.month || cur, +dir);
    ui.month = m >= cur ? '' : (m < firstMonth() ? firstMonth() : m);
    render();
  },
  'paybill': id => {
    const b = db.bills.find(x => x.id === id);
    if (!b) return;
    draft = newDraft('expense');
    draft.category = b.kind === 'sub' ? 'Subscriptions' : 'Bills';
    draft.billId = b.id;
    draft.forMonth = autoForMonth(b, todayStr());
    draft.amount = amtStr(b.amount);
    draft.prefilled = draft.amount;
    ui.view = 'log';
    render();
    window.scrollTo(0, 0);
  },
  'fix': () => fixSheet(),
  'fix-save': () => { const n = applyFixes($('#sheet')); closeSheet(); render(); toast(n ? 'Balances corrected' : 'Nothing changed'); },
  'settings': () => { if (!settingsOpen) { settingsOpen = true; history.pushState({ overlay: 'settings' }, ''); } render(); window.scrollTo(0, 0); },
  'close-settings': () => { if (settingsOpen) history.back(); },
  'sync-now': () => { net.error = net.error === 'bad_key' ? net.error : ''; sync(); },
  'save-pay': () => {
    const pay = parseAmt($('#set-pay').value);
    const anchor = $('#set-anchor').value;
    if (!(pay > 0)) return nudge($('#set-pay'), 'Enter your usual paycheque');
    if (!isDate(anchor)) return nudge($('#set-anchor'), 'Pick a payday');
    $('#set-pay').blur(); $('#set-anchor').blur();
    commit('settings.put', { payAmount: pay, payAnchor: anchor, payEvery: 14 });
    toast('Pay saved');
  },
  'save-conn': () => {
    const api = $('#set-api').value.trim(), key = $('#set-key').value.trim();
    if (!api || !key) return toast('Enter both the URL and the key');
    conf = { api, key };
    write(KEYS.conf, conf);
    net.error = '';
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    sync().then(ok => toast(ok ? 'Connected' : errorWords(net.error)));
  },
  'bill-new': () => billSheet(''),
  'bill-edit': id => billSheet(id),
  'bill-save': id => saveBill(id),
  'bill-del': (id, btn) => armDelete(btn, () => { commit('bill.del', { id }); closeSheet(); toast('Deleted'); }),
  'debt-new': () => debtSheet(''),
  'debt-edit': id => debtSheet(id),
  'debt-save': id => saveDebt(id),
  'debt-del': (id, btn) => armDelete(btn, () => { commit('debt.del', { id }); closeSheet(); toast('Deleted'); }),
  'debt-pay': id => debtPaySheet(id),
  'debt-pay-save': id => {
    const el = $('#sheet');
    const amt = parseAmt(sv(el, 'amount'));
    if (!(amt > 0)) return nudge(el.querySelector('[data-f="amount"]'), 'Enter the payment amount');
    const date = isDate(sv(el, 'date')) ? sv(el, 'date') : todayStr();
    const d = db.debts.find(x => x.id === id);
    const op = { id: uid('p'), debtId: id, amount: amt, date, created: new Date().toISOString() };
    commit('debt.pay', op);
    closeSheet();
    toast(`Subtracted ${moneyAbs(amt)} from ${d ? d.name : 'debt'}`, 'Undo', () => commit('debt.unpay', { id: op.id }));
  },
  'debt-unpay': id => { commit('debt.unpay', { id }); toast('Payment undone'); },
  'connect': async () => {
    const api = $('#ob-api').value.trim(), key = $('#ob-key').value.trim();
    if (!api || !key) { ui.connectMsg = 'Paste both the web app URL and the key.'; return render(); }
    conf = { api, key };
    write(KEYS.conf, conf);
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    ui.connecting = true; ui.connectMsg = '';
    render();
    const ok = await sync();
    ui.connecting = false;
    if (ok) ui.connectMsg = '';
    else if (net.error === 'offline') ui.connectMsg = 'You’re offline. Connect to the internet and try again.';
    else if (net.error === 'unreachable') ui.connectMsg = 'Couldn’t reach that URL. Check it ends in /exec and the deployment’s access is set to Anyone.';
    else ui.connectMsg = errorWords(net.error);
    render();
  },
  'start': () => {
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    ui.view = 'log';
    applyFixes($('#view'));
    commit('settings.put', { startDate: todayStr() });
    toast('All set. Log your first expense.');
  },
};

/* ================= events ================= */
document.addEventListener('click', e => {
  if (e.target.closest('#scrim')) { closeSheet(); return; }
  const btn = e.target.closest('[data-act]');
  if (!btn || btn.disabled) return;
  const raw = btn.dataset.act;
  const i = raw.indexOf(':');
  const name = i < 0 ? raw : raw.slice(0, i);
  const arg = i < 0 ? '' : raw.slice(i + 1);
  if (actions[name]) actions[name](arg, btn, e);
});

document.addEventListener('input', e => {
  if (e.target.dataset.in === 'note') draft.note = e.target.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.in === 'defaultAccount') {
    t.blur();
    commit('settings.put', { defaultAccount: t.value });
    toast(`New entries default to ${acct(t.value).name}`);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('.note, [enterkeyhint="done"]')) { e.target.blur(); return; }
  if (e.target.matches && e.target.matches('input, select, textarea')) return;
  if (e.key === 'Escape' && sheetOpen) { closeSheet(); return; }
  if (currentView() !== 'log' || sheetOpen || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[0-9.]$/.test(e.key)) { pressKey(e.key); e.preventDefault(); }
  else if (e.key === 'Backspace') { pressKey('back'); e.preventDefault(); }
});
document.addEventListener('focusout', () => {
  if (!deferred) return;
  setTimeout(() => {
    const a = document.activeElement;
    if (deferred && !(a && a.closest && a.closest('#view') && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))) render();
  }, 350);
});

window.addEventListener('online', () => scheduleSync(0));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { render(); scheduleSync(0); }
});
setInterval(() => { if (queue.length && !net.syncing) sync(); }, 30000);

/* ================= start up ================= */
(function boot() {
  // A setup link like .../#api=<url>&key=<key> fills in the connection for you.
  const h = location.hash.slice(1);
  if (h.startsWith('api=')) {
    const k = h.indexOf('&key=');
    if (k > 0) {
      conf = { api: decodeURIComponent(h.slice(4, k)), key: decodeURIComponent(h.slice(k + 5)) };
      write(KEYS.conf, conf);
    }
    history.replaceState(null, '', location.pathname + location.search);
  } else if (['log', 'overview', 'debt'].includes(h)) {
    ui.view = h;
    history.replaceState(null, '', location.pathname + location.search);
  }
  render();
  if (conf.api && conf.key) sync();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();

// Exposed for testing only
window.__budget = { balances, monthData, billsFor, paydays, autoForMonth, get db() { return db; }, get queue() { return queue; }, get draft() { return draft; } };
})();
</script>
